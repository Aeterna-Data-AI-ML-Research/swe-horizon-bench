  <text x="358" y="300" font-size="10" font-family="Helvetica,Arial,sans-serif" fill="#0f172a">76 failed episodes: 17 assertion · 22 exception · 18 import · 15 scratch</text>
  <text x="358" y="316" font-size="10" font-family="Helvetica,Arial,sans-serif" fill="#334155">On 32 never-solved tasks: 14/19 right-function edits still fail</text>
  <text x="358" y="332" font-size="10" font-weight="700" font-family="Helvetica,Arial,sans-serif" fill="#991b1b">11/14 fail primary issue assertion (needs python3 -c check)</text>
