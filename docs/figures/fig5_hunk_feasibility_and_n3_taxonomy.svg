  <rect width="690" height="355" fill="#ffffff"/>
  <text x="28" y="26" font-size="14" font-weight="700" font-family="Helvetica,Arial,sans-serif" fill="#0f172a">Figure 5. Structural localization recall vs actual behavioral resolution (Pass@1)</text>
  <text x="28" y="44" font-size="11" font-family="Helvetica,Arial,sans-serif" fill="#64748b">Reaching gold lines is necessary, not sufficient: gap between synthetic probe (upper bound), real localization, and passing pytest</text>

