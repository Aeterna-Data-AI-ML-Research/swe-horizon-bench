  <rect x="252" y="56" width="12" height="12" fill="#60a5fa"/><text x="268" y="66" font-size="9.5" font-family="Helvetica,Arial,sans-serif" fill="#334155">Gold-files AST-HG@3 (39.5% on multi-file; repo: 13%)</text>
  <rect x="525" y="56" width="12" height="12" fill="#dc2626"/><text x="541" y="66" font-size="9.5" font-weight="700" font-family="Helvetica,Arial,sans-serif" fill="#991b1b">Actual Pass@1</text>

