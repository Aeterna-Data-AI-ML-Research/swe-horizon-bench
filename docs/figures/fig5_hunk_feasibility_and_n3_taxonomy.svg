  <!-- Bottom panels: What explains the gap between Recall and Behavioral Pass@1 -->
  <line x1="28" y1="236" x2="662" y2="236" stroke="#e2e8f0"/>
  <text x="28" y="255" font-size="12" font-weight="700" font-family="Helvetica,Arial,sans-serif" fill="#0f172a">Why structural recall ≫ behavioral Pass@1: hunk-budget ceiling &amp; right-function logic failures</text>

  <rect x="28" y="265" width="305" height="76" rx="6" fill="#eff6ff" stroke="#2563eb"/>
  <text x="38" y="283" font-size="11" font-weight="700" font-family="Helvetica,Arial,sans-serif" fill="#1e3a8a">1. Hunk-budget feasibility (n=83 code diffs)</text>
  <text x="38" y="300" font-size="10" font-family="Helvetica,Arial,sans-serif" fill="#0f172a">1–3 hunks (n=54): 25.9% Pass@1 · ≥4 hunks (n=29): 0.0%</text>
  <text x="38" y="316" font-size="10" font-family="Helvetica,Arial,sans-serif" fill="#334155">22/29 solved tasks win via minimal-sufficient patches</text>
  <text x="38" y="332" font-size="10" font-weight="700" font-family="Helvetica,Arial,sans-serif" fill="#1e3a8a">Gold modified by edit_file 27/29 · write_file 0/29</text>

  <rect x="348" y="265" width="314" height="76" rx="6" fill="#fef2f2" stroke="#b91c1c"/>
