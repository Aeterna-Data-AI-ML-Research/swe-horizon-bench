<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="700" height="350" viewBox="0 0 700 350">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#475569"/>
    </marker>
    <marker id="arrRed" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#b91c1c"/>
    </marker>
  </defs>
  <rect width="700" height="350" fill="#ffffff"/>
  <text x="28" y="26" font-size="14" font-weight="700" font-family="Helvetica,Arial,sans-serif" fill="#0f172a">Figure 2. Causal chain: rank-64 LoRA serving overhead → episode censoring → leaderboard drop</text>
  <text x="28" y="44" font-size="11" font-family="Helvetica,Arial,sans-serif" fill="#64748b">Same Pass@1 on timed N=5 (0.40 = 0.40) and N=15 (4/15 → 5/15) — failure is serving cost under a fixed 12 h wall, not accuracy</text>

  <!-- 5-stage causal flow -->
  <rect x="24" y="62" width="116" height="82" rx="6" fill="#eff6ff" stroke="#2563eb" stroke-width="1.3"/>
  <text x="34" y="80" font-size="11" font-weight="700" font-family="Helvetica,Arial,sans-serif" fill="#1e3a8a">1. Rank-64 LoRA</text>
  <text x="34" y="96" font-size="10" font-family="Helvetica,Arial,sans-serif" fill="#334155">7 projections × 60</text>
  <text x="34" y="110" font-size="10" font-family="Helvetica,Arial,sans-serif" fill="#334155">layers on W4A16</text>
  <text x="34" y="128" font-size="10" font-weight="700" font-family="Helvetica,Arial,sans-serif" fill="#1e3a8a">Smoke Pass@1: 0.30</text>

  <line x1="140" y1="103" x2="156" y2="103" stroke="#475569" stroke-width="1.5" marker-end="url(#arr)"/>

  <rect x="160" y="62" width="122" height="82" rx="6" fill="#fff7ed" stroke="#c2410c" stroke-width="1.3"/>
  <text x="170" y="80" font-size="11" font-weight="700" font-family="Helvetica,Arial,sans-serif" fill="#9a3412">2. Punica SGMV</text>
  <text x="170" y="96" font-size="10" font-family="Helvetica,Arial,sans-serif" fill="#334155">+840 bf16 shrink/</text>
  <text x="170" y="110" font-size="10" font-family="Helvetica,Arial,sans-serif" fill="#334155">expand launches/tok</text>
  <text x="170" y="128" font-size="10" font-weight="700" font-family="Helvetica,Arial,sans-serif" fill="#9a3412">Breaks W4A16 fusion</text>

  <line x1="282" y1="103" x2="298" y2="103" stroke="#475569" stroke-width="1.5" marker-end="url(#arr)"/>

  <rect x="302" y="62" width="124" height="82" rx="6" fill="#fff7ed" stroke="#c2410c" stroke-width="1.3"/>
  <text x="312" y="80" font-size="11" font-weight="700" font-family="Helvetica,Arial,sans-serif" fill="#9a3412">3. Throughput −45%</text>
  <text x="312" y="96" font-size="10" font-family="Helvetica,Arial,sans-serif" fill="#334155">20.09 → 11.01 tok/s</text>
  <text x="312" y="110" font-size="10" font-family="Helvetica,Arial,sans-serif" fill="#334155">episode tok/s (Table 3)</text>
  <text x="312" y="128" font-size="10" font-weight="700" font-family="Helvetica,Arial,sans-serif" fill="#9a3412">N=15: −33%, p&lt;0.001</text>

  <line x1="426" y1="103" x2="442" y2="103" stroke="#b91c1c" stroke-width="1.5" marker-end="url(#arrRed)"/>

  <rect x="446" y="62" width="116" height="82" rx="6" fill="#fef2f2" stroke="#b91c1c" stroke-width="1.3"/>
  <text x="456" y="80" font-size="11" font-weight="700" font-family="Helvetica,Arial,sans-serif" fill="#991b1b">4. Episode cap</text>
  <text x="456" y="96" font-size="10" font-family="Helvetica,Arial,sans-serif" fill="#334155">Wall 301 → 388 s</text>
  <text x="456" y="110" font-size="10" font-family="Helvetica,Arial,sans-serif" fill="#334155">N=15: +90.5 s, p&lt;0.001</text>
  <text x="456" y="128" font-size="10" font-weight="700" font-family="Helvetica,Arial,sans-serif" fill="#991b1b">10.0 h → 12.9 h /120</text>

  <line x1="562" y1="103" x2="578" y2="103" stroke="#b91c1c" stroke-width="1.5" marker-end="url(#arrRed)"/>

  <rect x="582" y="62" width="96" height="82" rx="6" fill="#fef2f2" stroke="#991b1b" stroke-width="1.5"/>
  <text x="592" y="80" font-size="11" font-weight="700" font-family="Helvetica,Arial,sans-serif" fill="#7f1d1d">5. Host 12 h</text>
  <text x="592" y="96" font-size="10" font-family="Helvetica,Arial,sans-serif" fill="#334155">8m LoRA: blank</text>
  <text x="592" y="110" font-size="10" font-family="Helvetica,Arial,sans-serif" fill="#334155">6m LoRA: 0.12</text>
  <text x="592" y="128" font-size="10" font-weight="700" font-family="Helvetica,Arial,sans-serif" fill="#1e3a8a">Base 240s: 0.18</text>

  <!-- Bottom left: counterfactual wall decomposition -->
  <line x1="24" y1="160" x2="678" y2="160" stroke="#e2e8f0" stroke-width="1"/>
  <text x="28" y="182" font-size="12" font-weight="700" font-family="Helvetica,Arial,sans-serif" fill="#0f172a">A. Paired N=5 wall-clock attribution (300.9 s → 388.0 s)</text>
  <text x="28" y="200" font-size="10" font-family="Helvetica,Arial,sans-serif" fill="#475569">Fewer tokens (6043→4272) save</text>
  <rect x="200" y="189" width="78" height="15" rx="2" fill="#2563eb"/>
  <text x="205" y="200" font-size="10" font-weight="700" font-family="Helvetica,Arial,sans-serif" fill="#ffffff">−88 s</text>

  <text x="28" y="222" font-size="10" font-family="Helvetica,Arial,sans-serif" fill="#475569">Lower throughput (20.1→11.0) adds</text>
  <rect x="200" y="211" width="155" height="15" rx="2" fill="#c2410c"/>
  <text x="205" y="222" font-size="10" font-weight="700" font-family="Helvetica,Arial,sans-serif" fill="#ffffff">+175 s (Punica rate penalty)</text>

  <text x="28" y="244" font-size="10" font-weight="700" font-family="Helvetica,Arial,sans-serif" fill="#0f172a">Observed net episode delta</text>
  <rect x="200" y="233" width="77" height="15" rx="2" fill="#0f172a"/>
  <text x="205" y="244" font-size="10" font-weight="700" font-family="Helvetica,Arial,sans-serif" fill="#ffffff">+87.2 s (+29%)</text>

  <!-- Bottom right: 120-task projected wall vs 12 h host cutoff (incl. MS-SFT remedy) -->
  <line x1="378" y1="168" x2="378" y2="336" stroke="#e2e8f0" stroke-width="1"/>
  <text x="394" y="182" font-size="12" font-weight="700" font-family="Helvetica,Arial,sans-serif" fill="#0f172a">B. 120-task wall vs 12.0 h host cutoff (think 4096)</text>

  <!-- scale: 16h = 260px -> 16.25 px/h; 12h line at x = 394 + 80 + 195 = 669? Keep compact: bar x0=488, 12px/h -> 12h=144px (x=632) -->
  <text x="394" y="206" font-size="10" font-family="Helvetica,Arial,sans-serif" fill="#334155">Base (20.1 tok/s)</text>
  <rect x="492" y="195" width="120" height="14" rx="2" fill="#2563eb"/>
  <text x="617" y="206" font-size="10" font-weight="700" font-family="Helvetica,Arial,sans-serif" fill="#1e3a8a">10.0 h ✓</text>

  <text x="394" y="228" font-size="10" font-family="Helvetica,Arial,sans-serif" fill="#334155">LoRA N=5 (11.0)</text>
  <rect x="492" y="217" width="155" height="14" rx="2" fill="#c2410c"/>
  <text x="651" y="228" font-size="10" font-weight="700" font-family="Helvetica,Arial,sans-serif" fill="#991b1b">12.9 h ✗</text>

  <text x="394" y="250" font-size="10" font-family="Helvetica,Arial,sans-serif" fill="#334155">LoRA Uniform SFT</text>
  <rect x="492" y="239" width="169" height="14" rx="2" fill="#dc2626"/>
  <text x="664" y="250" font-size="10" font-weight="700" font-family="Helvetica,Arial,sans-serif" fill="#991b1b">14.1 h ✗</text>

  <text x="394" y="272" font-size="10" font-family="Helvetica,Arial,sans-serif" fill="#334155">LoRA Full-gold PR</text>
  <rect x="492" y="261" width="181" height="14" rx="2" fill="#991b1b"/>
  <text x="610" y="271" font-size="9" font-weight="700" font-family="Helvetica,Arial,sans-serif" fill="#ffffff">15.1 h ✗</text>

  <text x="394" y="294" font-size="10" font-weight="700" font-family="Helvetica,Arial,sans-serif" fill="#166534">LoRA + MS-SFT</text>
  <rect x="492" y="283" width="142" height="14" rx="2" fill="#16a34a"/>
  <text x="640" y="294" font-size="10" font-weight="700" font-family="Helvetica,Arial,sans-serif" fill="#166534">11.9 h ✓</text>

  <!-- 12.0 h cutoff line at 492 + 144 = 636 -->
  <line x1="636" y1="188" x2="636" y2="306" stroke="#0f172a" stroke-width="1.5" stroke-dasharray="3,3"/>
  <text x="598" y="320" font-size="10" font-weight="700" font-family="Helvetica,Arial,sans-serif" fill="#0f172a">12.0 h host wall</text>

  <text x="28" y="272" font-size="10" font-weight="700" font-family="Helvetica,Arial,sans-serif" fill="#0f172a">Episode throughput = completion tokens / episode wall</text>
  <text x="28" y="288" font-size="9.5" font-family="Helvetica,Arial,sans-serif" fill="#475569">Smoke n=10: 16.59→12.16 (−27%) · Core n=5: 20.09→11.01 (−45%)</text>
  <text x="28" y="303" font-size="9.5" font-family="Helvetica,Arial,sans-serif" fill="#475569">N=15: 18.13→12.10 (−33%) · uncensored n=8: 19.74→11.95 (−39%)</text>
  <text x="28" y="320" font-size="9" font-family="Helvetica,Arial,sans-serif" fill="#64748b">Panel B SFT rows: projections at 11.01 tok/s (§6.2).</text>
</svg>
